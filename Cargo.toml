[package]
name = "camnexus"
version = "0.5.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
eframe = { version = "0.37.0", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
md-5 = "0.11.0"
ort = { version = "=2.0.0-rc.15", features = ["download-binaries", "copy-dylibs", "directml"] }
resvg = { version = "0.49.0", default-features = false }
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
sha2 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Time", "Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_Security", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
